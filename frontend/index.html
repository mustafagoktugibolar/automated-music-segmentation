<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Segmentation Dashboard</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
        }

        h2 {
            font-size: 1.25rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 0.5rem;
            border: 2px dashed var(--border);
            border-radius: 8px;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: normal;
            background: #f9fafb;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-label:hover {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #status-area {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            background: #e0f2fe;
            color: #0369a1;
            display: none;
        }

        .result-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            overflow-x: auto;
        }

        pre {
            margin: 0;
            font-size: 0.875rem;
            color: #374151;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Music Segmentation</h1>
            <p>Upload an audio file to analyze its structure using multiple algorithms.</p>

            <div class="form-group">
                <label>1. Select Audio File</label>
                <input type="file" id="audioFile" accept=".mp3,.wav,.flac,.ogg,.m4a">
            </div>

            <div class="form-group">
                <label>2. Select Algorithms</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" value="custom" checked> Custom
                        (Optimized)</label>
                    <label class="checkbox-label"><input type="checkbox" value="foote" checked> MSAF Foote</label>
                    <label class="checkbox-label"><input type="checkbox" value="cnmf" checked> MSAF CNMF</label>
                    <label class="checkbox-label"><input type="checkbox" value="scluster" checked> MSAF
                        S-Cluster</label>
                </div>
            </div>

            <button type="button" id="uploadBtn" onclick="startProcess()">Start Segmentation</button>
        </div>

        <div id="status-area">
            <span class="loader"></span> <span id="status-text">Processing...</span>
        </div>

        <div id="results-container"></div>
    </div>

    <script>
        let pollInterval = null;

        async function startProcess() {
            const fileInput = document.getElementById('audioFile');
            const uploadBtn = document.getElementById('uploadBtn');
            const statusArea = document.getElementById('status-area');
            const statusText = document.getElementById('status-text');
            const resultsContainer = document.getElementById('results-container');

            if (!fileInput.files[0]) {
                alert("Please select a file first!");
                return;
            }

            // Get selected algorithms
            const checkboxes = document.querySelectorAll('.checkbox-group input:checked');
            const algorithms = Array.from(checkboxes).map(cb => cb.value);

            if (algorithms.length === 0) {
                alert("Please select at least one algorithm.");
                return;
            }

            // Reset UI
            uploadBtn.disabled = true;
            statusArea.style.display = 'block';
            statusText.innerText = "Uploading...";
            resultsContainer.innerHTML = '';

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("algorithms", JSON.stringify(algorithms));

            try {
                const BACKEND_URL = "http://localhost:8000";
                console.log(`Sending upload request to ${BACKEND_URL}/segmentation/upload...`);

                const response = await fetch(`${BACKEND_URL}/segmentation/upload`, {
                    method: "POST",
                    body: formData
                });

                const responseText = await response.text();

                // Log strictly to console for debug
                console.log("Response Status:", response.status);
                console.log("Response Text:", responseText);

                if (!response.ok) {
                    throw new Error(`Server Error (${response.status} ${response.statusText}): ${responseText.substring(0, 200)}`);
                }

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    // Try to extract error message if it's HTML
                    if (responseText.includes("<!DOCTYPE html>")) {
                        const match = responseText.match(/<title>(.*?)<\/title>/)
                        if (match) throw new Error(`Server Error (${response.status}): ${match[1]}`);
                    }
                    throw new Error(`Invalid JSON Response (${response.status}): ${responseText.substring(0, 200)}`);
                }

                const taskId = data.task_id;

                statusText.innerText = `Task ID: ${taskId} - Processing... (Checking every 3s)`;

                // Start Polling
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(() => checkStatus(taskId), 3000);

            } catch (error) {
                console.error(error);
                statusText.innerText = "Error: " + error.message;
                uploadBtn.disabled = false;
            }
        }

        async function checkStatus(taskId) {
            try {
                const BACKEND_URL = "http://localhost:8000";
                const response = await fetch(`${BACKEND_URL}/segmentation/status/${taskId}`);
                const responseText = await response.text();

                if (!response.ok) {
                    console.warn(`Status check failed (${response.status}): ${responseText}`);
                    return;
                }

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    console.error("Invalid JSON in status check:", responseText);
                    return;
                }
                const resultsContainer = document.getElementById('results-container');
                const statusText = document.getElementById('status-text');
                const uploadBtn = document.getElementById('uploadBtn');

                // Render current results
                resultsContainer.innerHTML = ''; // Clear and redraw

                // Check if we have any results to show
                const results = data.results || {};
                const resultKeys = Object.keys(results);

                if (resultKeys.length > 0) {
                    resultKeys.forEach(algo => {
                        const resultHtml = `
                        <div class="card">
                            <h2>Results: ${algo.toUpperCase()}</h2>
                            <div class="result-box">
                                <pre>${JSON.stringify(results[algo], null, 2)}</pre>
                            </div>
                        </div>
                    `;
                        resultsContainer.insertAdjacentHTML('beforeend', resultHtml);
                    });
                }

                // Simple completion logic: If we have results from all requested, or some timeout/status logic
                // For now, we keep polling to see updates live. 
                // Ideally backend 'status' field should eventually say 'completed' when ALL are done. 
                // Current backend logic leaves it at 'processing' until we implement a global finish check.
                // So we just keep polling.

                // If data.status === 'completed', stop polling (if backend implemented that)
                // statusText.innerText = `Status: ${data.status.toUpperCase()}`;

            } catch (error) {
                console.error("Polling error", error);
            }
        }
    </script>

</body>

</html>
