worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Single entry point for the whole system. Today there is only the
    # segmentation service; adding another service later is one more
    # `location /api/<service>/` block routed to that service's own
    # container — the segmentation service's routes and code never change.
    server {
        listen 80;

        # -> segmentation service's FastAPI app (routers already mounted at
        # /segmentation, /evaluation, /datasets, /health, /songs — stripping
        # the /api prefix here lands exactly on those paths).
        location /api/ {
            proxy_pass http://music_segmentation_backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;

            # /segmentation/stream/{task_id} is a long-lived SSE connection —
            # buffering/caching would delay or truncate events.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Connection "";
        }

        # everything else -> the frontend
        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
