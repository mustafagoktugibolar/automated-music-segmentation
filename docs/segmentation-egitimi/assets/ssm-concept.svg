<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">Feature dizisinden self-similarity matrix ve novelty eğrisi</title>
  <desc id="desc">Zaman frame özellikleri birbirleriyle karşılaştırılır, tekrar blokları içeren SSM oluşur ve checkerboard işlemi novelty tepeleri üretir.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker>
  <style>.t{font:700 21px system-ui;fill:#0f172a}.h{font:600 15px system-ui;fill:#0f172a}.s{font:13px system-ui;fill:#334155}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}</style></defs>
  <rect width="1100" height="480" rx="20" fill="#fff"/><text x="35" y="38" class="t">Feature frame’leri → SSM → novelty → boundary</text>
  <rect x="35" y="70" width="250" height="350" rx="14" class="b"/><text x="55" y="102" class="h">INPUT: frame feature’ları</text>
  <text x="55" y="128" class="s">Her sütun bir zaman anı</text>
  <g transform="translate(65 155)">
    <rect width="190" height="36" fill="#dbeafe"/><rect y="44" width="190" height="36" fill="#bfdbfe"/><rect y="88" width="190" height="36" fill="#ddd6fe"/><rect y="132" width="190" height="36" fill="#c4b5fd"/>
    <path d="M20 0V168M50 0V168M80 0V168M110 0V168M140 0V168M170 0V168" stroke="#fff" stroke-width="2"/>
  </g>
  <text x="65" y="352" class="s">Chroma + MFCC</text><text x="65" y="378" class="s">L2 normalize edilmiş vektörler</text>
  <line x1="285" y1="245" x2="355" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="355" y="70" width="350" height="350" rx="14" class="b"/><text x="375" y="102" class="h">İŞLEM: her frame’i her frame’le karşılaştır</text>
  <g transform="translate(405 130)">
    <rect width="240" height="240" fill="#e2e8f0"/>
    <rect x="0" y="0" width="80" height="80" fill="#312e81"/><rect x="80" y="80" width="80" height="80" fill="#312e81"/><rect x="160" y="160" width="80" height="80" fill="#312e81"/>
    <rect x="0" y="160" width="80" height="80" fill="#7c3aed" opacity=".75"/><rect x="160" y="0" width="80" height="80" fill="#7c3aed" opacity=".75"/>
    <path d="M0 0L240 240" stroke="#fff" stroke-width="5"/>
  </g>
  <text x="405" y="395" class="s">Parlak blok = iki zaman bölgesi birbirine benziyor</text>
  <line x1="705" y1="245" x2="775" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="775" y="70" width="290" height="350" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="795" y="102" class="h">OUTPUT: novelty curve</text>
  <line x1="800" y1="330" x2="1040" y2="330" stroke="#64748b"/>
  <path d="M800 325 C830 323 845 320 865 315 C890 306 900 180 920 315 C945 325 960 322 975 315 C995 305 1008 205 1025 318 L1040 325" fill="none" stroke="#059669" stroke-width="4"/>
  <line x1="908" y1="160" x2="908" y2="340" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/><line x1="1010" y1="190" x2="1010" y2="340" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="800" y="370" class="s">Yüksek peak → yapısal değişim adayı</text><text x="800" y="395" class="s">Peak zamanı → boundary candidate</text>
</svg>
