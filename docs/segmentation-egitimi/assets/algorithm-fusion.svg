<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
  <title id="title">Algorithm-level fusion vote timeline</title><desc id="desc">Dört algoritmanın yakın boundary zamanları bir oy grubuna alınır, weight ve confidence ile skorlanır ve tek fused boundary üretilir.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker>
  <style>.t{font:700 21px system-ui;fill:#0f172a}.h{font:600 14px system-ui;fill:#0f172a}.s{font:12px system-ui;fill:#334155}.axis{stroke:#64748b;stroke-width:2}</style></defs>
  <rect width="1100" height="490" rx="20" fill="#fff"/><text x="35" y="38" class="t">Algorithm-level fusion: yakın timestamp oylarından tek karar</text>
  <text x="35" y="75" class="h">INPUT: tamamlanmış algoritmaların internal boundary oyları</text>
  <g transform="translate(55 105)">
    <text x="0" y="15" class="h">custom_librosa</text><line x1="140" y1="10" x2="650" y2="10" class="axis"/><circle cx="360" cy="10" r="9" fill="#7c3aed"/><text x="375" y="15" class="s">40.2 s, c=.80, w=.35</text>
    <text x="0" y="75" class="h">scluster</text><line x1="140" y1="70" x2="650" y2="70" class="axis"/><circle cx="440" cy="70" r="9" fill="#2563eb"/><text x="455" y="75" class="s">41.0 s, c=.70, w=.30</text>
    <text x="0" y="135" class="h">cnmf</text><line x1="140" y1="130" x2="650" y2="130" class="axis"/><text x="300" y="135" class="s">bu grupta oy yok</text>
    <text x="0" y="195" class="h">foote</text><line x1="140" y1="190" x2="650" y2="190" class="axis"/><circle cx="320" cy="190" r="9" fill="#f59e0b"/><text x="335" y="195" class="s">39.8 s, c=.60, w=.15</text>
    <rect x="285" y="-18" width="190" height="236" rx="12" fill="#ddd6fe" opacity=".28" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="315" y="235" class="s">merge window içindeki vote group</text>
  </g>
  <line x1="725" y1="220" x2="800" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="800" y="95" width="265" height="265" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="820" y="128" class="h">İŞLEM</text>
  <text x="820" y="163" class="s">score = .35×.80 + .30×.70</text><text x="820" y="185" class="s">        + .15×.60 = .58</text>
  <text x="820" y="225" class="s">.58 ≥ .30 → accepted</text>
  <text x="820" y="265" class="s">custom_snap açık:</text><text x="820" y="287" class="s">custom zamanı anchor olur</text>
  <rect x="820" y="310" width="225" height="34" rx="8" fill="#dcfce7"/><text x="838" y="333" class="h">OUTPUT: boundary 40.2 s</text>
  <text x="35" y="440" class="s">Not: Başlangıç 0 ve track sonu oy değildir. Bunlar zorunlu timeline kenarlarıdır; yalnız internal boundary'ler fusion'a katılır.</text>
</svg>
