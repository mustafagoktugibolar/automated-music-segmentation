apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: music-segmentation
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: music-segmentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: music-segmentation-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: music-segmentation-env }
          env:
            - name: SERVICE_NAME
              value: music_segmentation_backend
          volumeMounts:
            - name: media-data
              mountPath: /app/media
          readinessProbe:
            httpGet:
              path: /health/app
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/app
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data
