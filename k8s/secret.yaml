# Mirrors .env.template. Replace every value below before applying,
# then run: kubectl apply -f secret.yaml
# Do NOT commit this file after filling in real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: music-segmentation-env
  namespace: music-segmentation
type: Opaque
stringData:
  DB_HOST: music-segmentation-db
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: your_secret_password
  DB_NAME: music_segmentation_db

  PG_MIN_CONN: "1"
  PG_MAX_CONN: "10"
  PG_RETRY_COUNT: "5"
  PG_RETRY_WAIT: "3"
  PG_STATEMENT_TIMEOUT_MS: "15000"

  WORKER_CONCURRENCY: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

  AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=..."
  AZURE_STORAGE_CONTAINER_RAW: songs-container

  S3_PROVIDER: minio
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET_RAW: songs
  S3_REGION: us-east-1

  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

  LLM_PROVIDER: anthropic
  LLM_MODEL_NAME: ""
