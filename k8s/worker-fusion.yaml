apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-fusion
  namespace: music-segmentation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-fusion
  template:
    metadata:
      labels:
        app: worker-fusion
    spec:
      containers:
        - name: worker-fusion
          image: music-segmentation-worker:latest
          envFrom:
            - secretRef: { name: music-segmentation-env }
          env:
            - name: SERVICE_NAME
              value: worker-fusion
            - name: WORKER_TYPE
              value: fusion_segmentation
            - name: MESSAGE_CODE
              value: segmentation.fusion
            - name: WORKER_CONCURRENCY
              value: "2"
