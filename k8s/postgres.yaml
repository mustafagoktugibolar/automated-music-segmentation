apiVersion: v1
kind: Service
metadata:
  name: music-segmentation-db
  namespace: music-segmentation
spec:
  clusterIP: None
  selector:
    app: music-segmentation-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: music-segmentation-db
  namespace: music-segmentation
spec:
  serviceName: music-segmentation-db
  replicas: 1
  selector:
    matchLabels:
      app: music-segmentation-db
  template:
    metadata:
      labels:
        app: music-segmentation-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: music-segmentation-env, key: DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: music-segmentation-env, key: DB_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: music-segmentation-env, key: DB_NAME }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
