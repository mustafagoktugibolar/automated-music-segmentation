apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-conf
  namespace: music-segmentation
data:
  # Same routing as gateway/nginx.conf (used by Compose) — only the proxy_pass
  # hostnames differ: k8s Service names (backend, frontend) instead of
  # Compose container names. Keep both files in sync when routes change.
  nginx.conf: |
    worker_processes auto;

    events {
        worker_connections 1024;
    }

    http {
        include       mime.types;
        default_type  application/octet-stream;
        sendfile      on;

        server {
            listen 80;

            location /api/ {
                proxy_pass http://backend:8000/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;

                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
                proxy_set_header Connection "";
            }

            location / {
                proxy_pass http://frontend:80/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: music-segmentation
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: music-segmentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: music-segmentation-gateway:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: gateway-nginx-conf
