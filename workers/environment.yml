name: music-segmentation-worker-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - ffmpeg
  - numpy<1.24
  - scipy<1.9.0
  - pika
  - pip
  - pip:
    - msaf[all]
    - librosa
    - portalocker
    - azure-storage-blob
    - azure-core
    - boto3
    - pyarrow
    - pydantic-settings
    - mir_eval
    - lightgbm
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch
    - torchaudio
    - langchain-anthropic>=0.3
    - langchain-openai>=0.3
    - langchain-core>=0.3
    - langchain>=0.3